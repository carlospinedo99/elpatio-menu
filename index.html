<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Menú El Patio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style id="app-css">
/* Layout: one phone-width column (max 560px). Logo hero, promo, sticky chip nav, menu sections, footer with hours and links. Carrizo stripes divide "Pa' tomar" from "Pa' botanear". */
:root{
  --bg:#151C16; --surface:#1E271F; --raise:#2A352A; --line:rgba(232,223,207,.13);
  --sand:#E8DFCF; --muted:#A9AE99; --cane:#CDAA6E; --cane-lt:#DEBF88; --cane-dk:#87693C;
  --sage:#93A576; --chili:#E57D50; --ink:#1A140A; --scrim:rgba(6,9,6,.66); --glow:rgba(205,170,110,.13);
  --f-ui:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-accent:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(120% 55% at 50% -12%,var(--glow),transparent 62%);background-repeat:no-repeat;color:var(--sand);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cane);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px}
#app{position:relative;z-index:1}
.leaves{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.crown{position:absolute;height:auto}
.crown svg{display:block;width:100%;height:auto;overflow:visible}
.crown.r{transform:scaleX(-1)}
.cr1{width:320px;top:-70px;left:-30px;opacity:.5}
.cr2{width:295px;top:20%;right:-32px;opacity:.45}
.cr3{width:285px;top:45%;left:-38px;opacity:.42}
.cr4{width:300px;top:67%;right:-36px;opacity:.45}
.cr5{width:275px;bottom:-48px;left:-34px;opacity:.42}
@media (min-width:700px){.cr1,.cr4{width:390px}.cr2,.cr3,.cr5{width:340px}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Hero */
.hero{text-align:center;padding-block:28px 14px;display:grid;justify-items:center;gap:10px}
.logo{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 18px 50px rgba(0,0,0,.45)}
.tagline{margin:6px 0 0;font-size:11.5px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--cane)}
.lead{margin:0;font-family:var(--f-accent);font-style:italic;font-size:20px;line-height:1.3;text-wrap:balance}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:4px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:transparent;text-decoration:none}
.hero-hours{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:3px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hero-hours li{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.hero-hours li span:first-child{color:var(--sand)}
.hero-hours li.off span:first-child{color:var(--muted)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.open{color:var(--sand)}
.status.open .dot{background:var(--sage);box-shadow:0 0 0 4px rgba(147,165,118,.2)}

/* Promo */
.promo{margin-block:10px 18px;padding:14px 16px;border:1px solid rgba(205,170,110,.5);border-radius:14px;background:linear-gradient(135deg,rgba(205,170,110,.15),rgba(147,165,118,.07));display:grid;gap:4px}
.promo.off{opacity:.6;border-style:dashed}
.eyebrow{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--cane)}
.promo-title{margin:0;font-family:var(--f-accent);font-style:italic;font-size:23px;line-height:1.2;text-wrap:balance}
.promo-text{margin:0;font-size:15px;color:var(--muted)}
.promo .ed-btn{justify-self:start;margin-top:6px}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(21,28,22,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.nav-inner{max-width:560px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.nav-inner::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--sand);color:var(--bg);border-color:var(--sand)}
.nav-group{flex:none;align-self:center;font-family:var(--f-accent);font-style:italic;font-size:15px;color:var(--cane);padding-inline:4px 2px;white-space:nowrap}

/* Groups and sections */
.group{padding-top:30px}
.group:first-child{padding-top:14px}
.carrizo{height:12px;border-radius:2px;background:linear-gradient(180deg,transparent 44%,rgba(0,0,0,.28) 44% 56%,transparent 56%),repeating-linear-gradient(90deg,var(--cane) 0 5px,var(--cane-lt) 5px 8px,var(--cane-dk) 8px 9.5px);opacity:.85}
.group-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.avail{display:inline-flex;align-items:center;gap:8px;margin:12px 0 0;padding:7px 13px;border-radius:999px;background:rgba(205,170,110,.14);border:1px solid rgba(205,170,110,.45);color:var(--cane-lt);font-size:13.5px;font-weight:600}
.avail .dot{width:8px;height:8px;border-radius:50%;background:var(--cane)}
.avail.on{background:rgba(147,165,118,.14);border-color:rgba(147,165,118,.5);color:var(--sand)}
.avail.on .dot{background:var(--sage);box-shadow:0 0 0 4px rgba(147,165,118,.2)}
.group-note{margin:10px 0 0;font-family:var(--f-accent);font-style:italic;font-size:16px;color:var(--muted);text-wrap:pretty}
.group-title{margin:16px 0 0;font-family:var(--f-accent);font-style:italic;font-weight:400;font-size:34px;line-height:1.1}
.sec{padding-block:22px 4px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 48px)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec h2{margin:0;font-size:13.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--cane)}
.sec-note{margin:5px 0 0;font-family:var(--f-accent);font-style:italic;font-size:15.5px;color:var(--muted);text-wrap:pretty}
.cols{display:flex;justify-content:flex-end;margin-top:12px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.cols span{width:76px;text-align:right;line-height:1.25}
.cols small{display:block;font-size:10.5px;font-weight:500;letter-spacing:.02em;text-transform:none}
.cols.edit-pad{padding-right:48px}
.items{list-style:none;margin:6px 0 0;padding:0}
.item{display:flex;align-items:flex-start;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-body{flex:1;min-width:0}
.item-line{display:flex;align-items:baseline;gap:8px}
.name{min-width:0;font-weight:500;font-size:16.5px;overflow-wrap:anywhere}
.chili{display:inline-flex;gap:1px;color:var(--chili);flex:none;align-self:center}
.chili svg{width:13px;height:13px}
.leader{flex:1 1 12px;min-width:12px;border-bottom:1px dotted rgba(232,223,207,.26);transform:translateY(-4px)}
.prices{display:flex;flex:none}
.price{font-weight:600;color:var(--cane);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.prices.two .price{width:76px}
.desc{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tag svg{width:11px;height:11px}
.tag-new{background:var(--cane);color:var(--ink)}
.tag-rec{border:1px solid var(--sage);color:var(--sage)}
.tag-sold{background:rgba(229,125,80,.16);color:var(--chili)}
.tag-hid{border:1px dashed var(--muted);color:var(--muted)}
.item.sold .name,.item.sold .price{text-decoration:line-through;color:var(--muted)}
.item.is-hidden{opacity:.45}
.thumb{flex:none;width:64px;height:64px;padding:0;border:0;border-radius:10px;overflow:hidden;background:var(--raise)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img[src^="data:image/png"],.thumb img[src^="data:image/webp"],.photo-prev img[src^="data:image/png"],.photo-prev img[src^="data:image/webp"]{object-fit:contain}

/* Footer */
.foot{padding-block:40px 120px;display:grid;gap:12px}
.foot h2{margin:14px 0 0;font-size:13.5px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--cane)}
.hours{list-style:none;margin:0;padding:0}
.hours li{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hours li span:last-child{text-align:right;color:var(--muted)}
.hours li.closed{font-family:var(--f-accent);font-style:italic;color:var(--muted)}
.addr{margin:0;font-size:15.5px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.lnk{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border:1px solid var(--line);border-radius:999px;color:var(--sand);text-decoration:none;font-weight:500;font-size:14px}
.lnk svg{width:16px;height:16px}
.lnk.primary{background:var(--sand);color:var(--bg);border-color:var(--sand)}
.fine{margin:10px 0 0;font-size:12px;color:var(--muted)}

/* Buttons */
.btn{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--sand);font-weight:600;font-size:14px}
.btn.primary{background:var(--cane);border-color:var(--cane);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.warn{color:var(--chili);border-color:rgba(229,125,80,.5)}
.btn.warn.armed{background:var(--chili);color:var(--ink)}
.ed-btn{flex:none;padding:5px 11px;border:1px dashed rgba(205,170,110,.6);border-radius:999px;background:transparent;color:var(--cane);font-size:12px;font-weight:600}
.add-btn{width:100%;margin-top:10px;padding:12px;border:1px dashed rgba(232,223,207,.25);border-radius:12px;background:transparent;color:var(--muted);font-weight:600;font-size:14px}
.item-edit{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--cane);padding:0}
.item-edit svg{width:16px;height:16px}
body.editing .item{cursor:pointer}
body.editing .foot{padding-bottom:140px}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border:0;border-radius:999px;background:var(--sand);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fab svg{width:16px;height:16px}
.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--raise);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.adminbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.adminbar-msg{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.adminbar-msg b{color:var(--sand);font-weight:600}
.restore{margin-block:12px 0;padding:12px 14px;border-radius:12px;background:var(--raise);display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px}
.restore p{margin:0;flex:1 1 200px}

/* Sheet */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 16px;font-family:var(--f-accent);font-style:italic;font-weight:400;font-size:24px}
.fld{display:grid;gap:6px;margin:0 0 14px;padding:0;border:0;min-width:0}
.fld>span,.fld>legend{padding:0;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fld>legend{margin-bottom:6px}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=url],.sheet input[type=time],.sheet select,.sheet textarea{width:100%;font:inherit;font-size:16px;color:var(--sand);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.sheet textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;inset:0;margin:0}
.pill span{display:inline-flex;align-items:center;gap:3px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-weight:500;color:var(--muted)}
.pill span svg{width:13px;height:13px;color:var(--chili)}
.pill input:checked+span{background:var(--sand);border-color:var(--sand);color:var(--bg)}
.pill input:focus-visible+span{outline:2px solid var(--cane);outline-offset:2px}
.switch{display:flex;align-items:center;gap:12px;padding-block:8px;font-size:15px}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;margin:0;border-radius:14px;background:var(--raise);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s}
.switch input::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--sand);transition:transform .2s}
.switch input:checked{background:var(--sage)}
.switch input:checked::before{transform:translateX(18px)}
.photo-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.photo-prev{width:72px;height:72px;border-radius:10px;background:var(--raise);overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.upload{position:relative;overflow:hidden}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.move{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.danger{padding-top:14px;border-top:1px solid var(--line)}
.sheet-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.hrow{display:grid;gap:10px;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px}
.hrow .pills{gap:5px}
.hrow .pill span{padding:6px 0;width:38px;justify-content:center;font-size:12.5px}
.hrow-foot{display:flex;justify-content:flex-end}

.lightbox{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:20px;border:0;width:100%}
.lightbox img{max-width:100%;max-height:78vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:var(--sand);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Scrollspy ---------- */
/* A section becomes current only once its title reaches the bar at the top. */
var spyTick=false,lastActive=null;
function currentSection(){var secs=document.querySelectorAll(".sec");if(!secs.length)return null;
  var line=navBottom()+GAP+24,cur=null;
  for(var i=0;i<secs.length;i++){var h=secs[i].querySelector("h2")||secs[i];if(h.getBoundingClientRect().top<=line)cur=secs[i];else break;}
  /* at the very bottom, short last sections can never reach the bar: take the last title in the upper half */
  var se=document.scrollingElement||document.documentElement;
  if(window.innerHeight+pageY()>=se.scrollHeight-4){for(var j=secs.length-1;j>=0;j--){var hj=secs[j].querySelector("h2")||secs[j];if(hj.getBoundingClientRect().top<window.innerHeight*0.5){cur=secs[j];break;}}}
  return cur;}
function spyNow(){spyTick=false;if(Date.now()<navLock)return;var s=currentSection(),id=s?s.getAttribute("data-sec"):null;
  if(id===lastActive)return;lastActive=id;
  if(id)activate(id);else{var nav=$("navin");if(nav)nav.querySelectorAll(".chip.on").forEach(function(c){c.classList.remove("on");});}}
function spy(){lastActive=null;spyNow();}
window.addEventListener("scroll",function(){if(!spyTick){spyTick=true;requestAnimationFrame(spyNow);}},{passive:true});
window.addEventListener("resize",function(){lastActive=null;spyNow();});
var navLock=0;
function activate(id,force){if(!force&&Date.now()<navLock)return;var nav=$("navin");if(!nav)return;var on=null;
  nav.querySelectorAll(".chip").forEach(function(c){var a=(" "+(c.getAttribute("data-secs")||c.getAttribute("data-sec"))+" ").indexOf(" "+id+" ")>-1;c.classList.toggle("on",a);if(a)on=c;});
  /* instant, so it never cancels the page's own smooth scroll */
  if(on)nav.scrollLeft=Math.max(0,on.offsetLeft-nav.clientWidth/2+on.clientWidth/2);}
function navBottom(){var n=document.querySelector(".nav");if(!n)return 0;var top=parseFloat(getComputedStyle(n).top)||0;return top+n.offsetHeight;}
function pageY(){return window.pageYOffset||document.documentElement.scrollTop||0;}
function jump(y,smooth){try{window.scrollTo({top:Math.max(0,y),behavior:smooth?"smooth":"instant"});}catch(e){window.scrollTo(0,Math.max(0,y));}}
function settle(cb){var last=null,still=0,t0=Date.now();
  (function tick(){var y=pageY();if(y===last)still++;else{still=0;last=y;}
    if(still>=8||Date.now()-t0>2500)cb();else requestAnimationFrame(tick);})();}
var GAP=14;
function goTo(id){var sec=$("s-"+id);if(!sec)return;var h=sec.querySelector("h2")||sec;navLock=Date.now()+3000;activate(id,true);
  var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  jump(h.getBoundingClientRect().top+pageY()-navBottom()-GAP,!reduce);
  setTimeout(function(){settle(function(){
    /* final correction: the title must sit just under the bar, wherever the bar ended up */
    var d=h.getBoundingClientRect().top-(navBottom()+GAP);
    if(Math.abs(d)>3)jump(pageY()+d,false);
    if(Math.abs(h.getBoundingClientRect().top-(navBottom()+GAP))>60)sec.scrollIntoView({block:"start"});
    navLock=0;lastActive=id;});},120);}

  while(j>=0&&j<a.length&&a[j].group!==g)j+=dir;if(j<0||j>=a.length){toast(dir<0?"Ya es la primera.":"Ya es la última.");return;}

function hourRow(r,i){var days='';[1,2,3,4,5,6,0].forEach(function(d){days+=pill("checkbox","d"+i,"h"+i+"d"+d,d,DAYS_SHORT[d],r.days.indexOf(d)>-1);});

function saveInfo(){var rows=[];document.querySelectorAll("#f-hours .hrow").forEach(function(row){var days=[];row.querySelectorAll(".pill input:checked").forEach(function(c){days.push(+c.value);});
    var r={label:row.querySelector(".h-label").value.trim(),days:days,open:row.querySelector(".h-open").value,close:row.querySelector(".h-close").value};
    if(r.days.length&&r.open&&r.close)rows.push(r);});
  state.brand.tagline=val("f-tag");state.brand.lead=val("f-lead");
  state.info={hours:rows,address:val("f-addr"),maps:val("f-maps"),instagram:val("f-ig"),facebook:val("f-fb")};
  closeSheet();changed();toast("Datos guardados. Falta publicar.");}

/* ---------- Photos ---------- */
function shrink(file){return new Promise(function(res,rej){
  if(!file||!/^image\//.test(file.type||"image/"))return rej(new Error("type"));
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var max=640,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    var c=document.createElement("canvas");c.width=w;c.height=h;var x=c.getContext("2d");x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    /* JPEG has no transparency (it turns into black), so cut-out images keep their alpha */
    var clear=false;try{var px=x.getImageData(0,0,w,h).data;for(var i=3;i<px.length;i+=16){if(px[i]<250){clear=true;break;}}}catch(e){}
    if(!clear){res(c.toDataURL("image/jpeg",0.74));return;}
    var wp=c.toDataURL("image/webp",0.8);res(wp.indexOf("data:image/webp")===0?wp:c.toDataURL("image/png"));};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("decode"));};img.src=url;});}

/* ---------- Publish ---------- */
function buildDocument(data){
  var css=$("app-css").textContent,js=$("app-js").textContent,S="script",ST="style";
  var json=JSON.stringify(data).replace(/</g,"\\u003c").replace(new RegExp(String.fromCharCode(8232),"g"),"\\u2028").replace(new RegExp(String.fromCharCode(8233),"g"),"\\u2029");
  return PREFIX+"<title>"+TITLE+"</title>\n"+FONTS+"\n<"+ST+' id="app-css">'+css+"</"+ST+'>\n<div id="app"></div><div id="layer"></div>\n<'+S+' type="application/json" id="menu-data">'+json+"</"+S+">\n<"+S+' id="app-js">'+js+"</"+S+">\n\n</body></html>";}
/* ---------- Sync to the customer site (GitHub -> Cloudflare) ---------- */
var SYNC_KEY="elpatio-sync",SYNC_TASK="trig_01XuixnQEBGFUA2ttMj4zAAH",syncFail=null,syncBusy=false;
function sstore(){try{return window.sessionStorage;}catch(e){return null;}}
function markSync(v){var s=sstore();if(s)try{s.setItem(SYNC_KEY,v);}catch(e){}}
function takeSync(){var s=sstore();if(!s)return null;try{var v=s.getItem(SYNC_KEY);s.removeItem(SYNC_KEY);return v;}catch(e){return null;}}
var SYNC_MSG={
  no_mcp:"Esta vista no puede avisar a la página de clientes.",
  not_in_manifest:"No diste permiso para subir a la página de clientes. Toca Subir ahora y elige Permitir.",
  approval_required:"Falta tu aprobación. Toca Subir ahora y elige Permitir.",
  server_not_connected:"La conexión Claude Code Remote no está disponible en tu cuenta.",
  needs_reauth:"La conexión Claude Code Remote necesita reconectarse en Ajustes de Claude.",
  blocked_by_policy:"Tu cuenta no permite usar esa conexión desde el menú.",
  tool_error:"La tarea programada no arrancó.",
  other:"No se pudo avisar a la página de clientes."};
/* Resolves "ok" or a failure code; never rejects. */
function notifySite(){
  if(!(window.claude&&typeof window.claude.use==="function"))return Promise.resolve("no_mcp");
  return window.claude.use("mcp").then(function(mcp){
    if(!mcp)return "no_mcp";
    return mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:SYNC_TASK,text:"Antes del paso 1 espera 25 segundos (sleep 25) para que la publicación termine de guardarse."})
      .then(function(){return "ok";},function(e){var c=e&&e.code;return SYNC_MSG[c]?c:"other";});
  },function(){return "no_mcp";});}
function syncHtml(){if(!canEdit||!syncFail)return "";
  return '<div class="restore"><p>Se publicó aquí, pero no llegó a la página de clientes. '+esc(SYNC_MSG[syncFail]||SYNC_MSG.other)+'</p>'+
    '<button class="btn primary" data-act="sync-now"'+(syncBusy?' disabled':'')+'>'+(syncBusy?'Subiendo…':'Subir ahora')+'</button></div>';}
function syncNow(){if(syncBusy)return;syncBusy=true;render();
  notifySite().then(function(r){syncBusy=false;
    if(r==="ok"){syncFail=null;render();toast("Listo. La página de clientes se actualiza en 3 a 5 minutos.",6000);}
    else{syncFail=r;render();}});}
function afterReload(){var st=takeSync();if(!st)return;
  if(st==="ok")toast("Publicado. La página de clientes se actualiza sola en 3 a 5 minutos.",6000);
  else{syncFail=st;render();}}

function publish(){if(busy||!dirty)return;if(!artifactNS){toast("Publicar no está disponible en esta vista.");return;}
  var next=clone(state);next.rev=(saved.rev||0)+1;next.publishId=uid();next.updatedAt=new Date().toISOString();
  var html=buildDocument(next);
  if(html.length>15500000){toast("El menú pesa demasiado para publicarse. Quita algunas fotos.",4500);return;}
  saveDraft(next.publishId);busy=true;render();
  notifySite().then(function(r){markSync(r);return artifactNS.publish(html);}).then(function(){toast("Publicado.",4000);dirty=0;}).catch(function(e){busy=false;takeSync();var c=e&&e.code;
    if(c==="conflict"){toast("Había una versión más nueva. Recargando; tus cambios quedan para recuperar.",5000);return;}
    if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){canEdit=false;editing=false;render();toast("Esta vista es solo de lectura. Abre el menú desde tu cuenta de Claude para editar.",5000);return;}
    if(c==="too_large"){render();toast("El menú pesa demasiado. Quita algunas fotos y vuelve a publicar.",5000);return;}
    if(c==="rate_limited"){render();toast("Muchas publicaciones seguidas. Espera un minuto y vuelve a intentar.",5000);return;}
    render();toast("No se pudo publicar. Revisa tu conexión y toca Publicar otra vez.",5000);});}

/* ---------- Events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(!b){if(editing&&!sheet){var li=e.target.closest(".item");if(li){var f=findItem(li.getAttribute("data-item"));if(f)itemSheet(f.item,f.sec.id,false);}}return;}
  var a=b.getAttribute("data-act");
  switch(a){
    case "goto":goTo(b.getAttribute("data-sec"));break;
    case "photo":if(editing){var fp=findItem(b.getAttribute("data-item"));if(fp)itemSheet(fp.item,fp.sec.id,false);break;}
      var fi=findItem(b.getAttribute("data-item"));if(fi&&fi.item.photo)$("layer").innerHTML='<button class="lightbox" data-act="close" aria-label="Cerrar foto"><img src="'+esc(fi.item.photo)+'" alt="'+esc(fi.item.name)+'"></button>';break;
    case "scrim":if(e.target===b)closeSheet();break;
    case "close":if(sheet&&sheet.isNew)toast("Descartado.",1200);closeSheet();break;
    case "enter":editing=true;exitArmed=false;render();toast("Toca cualquier producto para editarlo.");break;
    case "exit":if(dirty&&!exitArmed){exitArmed=true;render();toast("Tienes cambios sin publicar. Toca otra vez para descartarlos.",3500);break;}
      state=clone(saved);dirty=0;exitArmed=false;editing=false;clearDraft();render();break;
    case "publish":publish();break;
    case "restore-draft":state=draftOffer.state;dirty=draftOffer.dirty||1;draftOffer=null;saveDraft();render();toast("Cambios recuperados. Falta publicar.");break;
    case "discard-draft":draftOffer=null;clearDraft();render();break;
    case "sync-now":syncNow();break;
    case "edit-item":var f2=findItem(b.getAttribute("data-item"));if(f2)itemSheet(f2.item,f2.sec.id,false);break;
    case "add-item":itemSheet({id:uid(),name:"",price:""},b.getAttribute("data-sec"),true);break;
    case "save-item":saveItem();break;
    case "item-up":moveItem(-1);break;
    case "item-down":moveItem(1);break;
    case "rm-photo":sheet.photo="";$("f-prev").innerHTML="Sin foto";$("f-photo-msg").textContent="Foto quitada. Toca Guardar.";break;
    case "del-item":if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toca otra vez para eliminar";break;}
      var fd=findItem(sheet.id);if(fd)fd.sec.items.splice(fd.idx,1);closeSheet();changed();toast("Producto eliminado. Falta publicar.");break;
    case "edit-sec":var fs=findSec(b.getAttribute("data-sec"));if(fs)secSheet(fs.sec,false);break;
    case "add-sec":secSheet({id:"sec-"+uid(),group:b.getAttribute("data-group"),title:"",note:"",labels:[],items:[]},true);break;
    case "save-sec":saveSec();break;
    case "sec-up":moveSec(-1);break;
    case "sec-down":moveSec(1);break;
    case "del-sec":if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Toca otra vez para eliminar la sección";break;}
      var fz=findSec(sheet.id);if(fz)state.sections.splice(fz.idx,1);closeSheet();changed();toast("Sección eliminada. Falta publicar.");break;
    case "edit-group":groupSheet(b.getAttribute("data-group"));break;
    case "save-group":saveGroup();break;
    case "edit-promo":promoSheet();break;
    case "save-promo":savePromo();break;
    case "edit-info":infoSheet();break;
    case "save-info":saveInfo();break;
    case "add-hour":var box=$("f-hours");var tmp=document.createElement("div");tmp.innerHTML=hourRow({label:"",days:[],open:"12:00",close:"23:00"},hourSeq++);box.appendChild(tmp.firstChild);break;
    case "del-hour":var row=b.closest(".hrow");if(row)row.remove();break;
  }
});
document.addEventListener("change",function(e){
  if(e.target.id!=="f-photo"||!sheet)return;var file=e.target.files&&e.target.files[0];if(!file)return;
  var msg=$("f-photo-msg");msg.textContent="Comprimiendo…";

    .catch(function(){msg.textContent="No pude leer esa foto. Prueba con una JPG o PNG.";});
  e.target.value="";});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("layer").innerHTML)closeSheet();});
window.addEventListener("beforeunload",function(e){if(editing&&dirty&&!busy){e.preventDefault();e.returnValue="";}});
setInterval(function(){var s=$("status");if(s)s.outerHTML=statusHtml();document.querySelectorAll(".avail").forEach(function(el){var g=null;groups().forEach(function(x){if(x.from===el.getAttribute("data-from"))g=x;});if(g)el.outerHTML=availHtml(g);});},60000);

(function leaves(){if(document.querySelector(".leaves"))return;
  function B(q,L){var u=1-q;return[2*u*q*L*.5+q*q*L,2*u*q*(-L*.2)+q*q*L*.28];}
  function N(q,L){var a=B(Math.max(0,q-.01),L),b=B(Math.min(1,q+.01),L),dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy);return[-dy/m,dx/m];}
  function f1(v){return v.toFixed(1);}
  function leaf(L){var n=11,i,q,p,m,d="M0 0 ",l="M0 0 ";
    for(i=0;i<=n;i++){q=i/n;p=B(q,L);m=N(q,L);var w=(1-q)*L*.06+1;d+="L"+f1(p[0]-m[0]*w)+" "+f1(p[1]-m[1]*w)+" ";}
    for(i=n;i>=0;i--){q=i/n;p=B(q,L);m=N(q,L);var dep=(1-q*.75)*L*.36;d+="L"+f1(p[0]+m[0]*dep+L*.07)+" "+f1(p[1]+m[1]*dep)+" ";
      var b=B(Math.max(0,q-.5/n),L);d+="L"+f1(b[0]+m[0]*dep*.25)+" "+f1(b[1]+m[1]*dep*.25)+" ";}
    for(i=0;i<=n;i++){q=i/n;p=B(q,L);m=N(q,L);var dd=(1-q*.75)*L*.12;l+="L"+f1(p[0]+m[0]*dd+L*.03)+" "+f1(p[1]+m[1]*dd)+" ";}
    for(i=n;i>=0;i--){p=B(i/n,L);l+="L"+f1(p[0])+" "+f1(p[1])+" ";}
    return '<path d="'+d+'Z" fill="#2B4A2F"/><path d="'+l+'Z" fill="#3F6440"/><path d="M0 0 Q'+(L*.5)+' '+(-L*.2)+' '+L+' '+(L*.28)+'" fill="none" stroke="#1E3322" stroke-width="1.4"/>';}
  function crown(spec){var g="";spec.forEach(function(s){g+='<g transform="translate(0 110) rotate('+s[0]+')'+(s[2]?' scale(1,-1)':'')+'">'+leaf(s[1])+'</g>';});
    return '<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';}
  var A=crown([[-62,98,1],[-28,112],[6,118],[40,108],[74,92]]),
      Bc=crown([[-50,100,1],[-14,114],[22,110],[58,96]]),
      C=crown([[-40,96,1],[-4,108],[34,100],[68,86]]);
  var box=document.createElement("div");box.className="leaves";box.setAttribute("aria-hidden","true");
  box.innerHTML='<div class="crown cr1">'+A+'</div><div class="crown r cr2">'+Bc+'</div><div class="crown cr3">'+C+'</div><div class="crown r cr4">'+A+'</div><div class="crown cr5">'+C+'</div>';
  document.body.insertBefore(box,document.body.firstChild);})();
render();
if(window.claude&&typeof window.claude.use==="function"){
  Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(function(r){
    var a=r[0],u=r[1];if(!a||!u)return null;return u.canEdit().then(function(ok){if(!ok)return;artifactNS=a;canEdit=true;checkDraft();render();afterReload();});
  }).catch(function(){});
}
})();
